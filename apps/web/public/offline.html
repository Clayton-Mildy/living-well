<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#CFA550" />
<title>CitraPremier</title>
<style>
  html, body { margin: 0; height: 100%; }
  body { font-family: Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; color: #24201C; background: #FFFFFF; display: flex; flex-direction: column; }
  .top { background: #CFA550; display: flex; align-items: center; justify-content: center; padding: calc(40px + env(safe-area-inset-top, 0px)) 0 40px; }
  .top img { width: 96px; height: 96px; display: block; }
  main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 24px 24px calc(24px + env(safe-area-inset-bottom, 0px)); text-align: center; }
  h1 { margin: 0; font-size: 22px; font-weight: 600; }
  p { margin: 0; font-size: 16px; line-height: 1.4; color: #5E5852; }
  .id { margin-top: 14px; } .id h1 { font-size: 18px; }
  button { margin-top: 24px; height: 52px; padding: 0 32px; border: 0; border-radius: 999px; background: #24201C; color: #FFFFFF; font: 600 16px Inter, system-ui, sans-serif; cursor: pointer; }
</style>
</head>
<body>
<div class="top"><img src="/brand-mark-white.svg" alt="" /></div>
<main>
  <h1>You're offline</h1>
  <p>Check the connection and try again</p>
  <div class="id"><h1>Anda sedang offline</h1><p>Periksa koneksi dan coba lagi</p></div>
  <button type="button" onclick="location.reload()">Try again · Coba lagi</button>
</main>
</body>
</html>
